name: Terraform CI/CD (AWS)

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

# Least privilege by default; jobs declare anything extra they need.
permissions:
  contents: read

# Never let two runs apply to production at the same time.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_VERSION: "1.9.8"
  # Terraform directories are configured in each job matrix below.
  AWS_REGION: "us-east-1"
  TERRASCAN_VERSION: "1.19.9"

jobs:

  config-check:
    name: Config Check
    runs-on: ubuntu-latest
    outputs:
      infracost_enabled: ${{ steps.secrets.outputs.infracost_enabled }}
    steps:
      - name: Check optional secrets
        id: secrets
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          if [ -n "${INFRACOST_API_KEY}" ]; then
            echo "infracost_enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "infracost_enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::INFRACOST_API_KEY not set, Infracost skipped"
          fi

  terraform-init-validate:
    strategy:
      fail-fast: false
      matrix:
        directory: [ec2, s3]
    name: Terraform Init & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false -input=false

      - name: Terraform Format
        working-directory: ${{ matrix.directory }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ${{ matrix.directory }}
        run: terraform validate

  tflint:
    strategy:
      fail-fast: false
      matrix:
        directory: [ec2, s3]
    name: TFLint
    needs: terraform-init-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint Init
        working-directory: ${{ matrix.directory }}
        run: tflint --init

      - name: TFLint Scan
        working-directory: ${{ matrix.directory }}
        run: tflint --recursive

  tfsec:
    strategy:
      fail-fast: false
      matrix:
        directory: [ec2, s3]
    name: tfsec
    needs: terraform-init-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: tfsec Scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ matrix.directory }}

  gitleaks:
    name: Gitleaks
    needs: terraform-init-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terrascan:
    strategy:
      fail-fast: false
      matrix:
        directory: [ec2, s3]
    name: Terrascan
    needs: terraform-init-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # tenable/terrascan-action ships an outdated binary that no longer
      # compiles the current policy bundle, so install a pinned release.
      - name: Install Terrascan
        run: |
          pkg="terrascan_${TERRASCAN_VERSION}_Linux_x86_64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/ts.tgz" \
            "https://github.com/tenable/terrascan/releases/download/v${TERRASCAN_VERSION}/${pkg}"
          tar -xzf "${RUNNER_TEMP}/ts.tgz" -C "${RUNNER_TEMP}" terrascan
          sudo install -m 0755 "${RUNNER_TEMP}/terrascan" /usr/local/bin/terrascan
          terrascan init

      - name: Terrascan Scan
        run: terrascan scan -i terraform -d "${{ matrix.directory }}"

  super-linter:
    name: Super Linter
    needs: terraform-init-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Super Linter
        uses: super-linter/super-linter/slim@v7
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_TERRAFORM: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true

  terraform-plan:
    strategy:
      fail-fast: false
      matrix:
        directory: [ec2, s3]
    name: Terraform Plan - ${{ matrix.directory }}
    needs:
      - terraform-init-validate
      - tflint
      - tfsec
      - gitleaks
      - terrascan
      - super-linter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Configure repository variable AWS_ROLE_ARN with the IAM role ARN.
      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsTerraform

      - name: Terraform Init
        working-directory: ${{ matrix.directory }}
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: ${{ matrix.directory }}
        run: terraform plan -input=false -out=tfplan

      - name: Export Plan Report and JSON
        working-directory: ${{ matrix.directory }}
        run: |
          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ matrix.directory }}
          if-no-files-found: error
          path: |
            ${{ matrix.directory }}/tfplan
            ${{ matrix.directory }}/tfplan.txt
            ${{ matrix.directory }}/tfplan.json

  infracost:
    strategy:
      fail-fast: false
      matrix:
        directory: [ec2, s3]
    name: Infracost
    needs:
      - terraform-plan
      - config-check
    if: needs.config-check.outputs.infracost_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false -input=false

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Cost Estimate
        working-directory: ${{ matrix.directory }}
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          infracost breakdown --path . --format json --out-file infracost.json

      - name: Display Cost
        working-directory: ${{ matrix.directory }}
        run: infracost output --path infracost.json --format table

      - name: Upload Infracost Report
        uses: actions/upload-artifact@v4
        with:
          name: infracost-report-${{ matrix.directory }}
          if-no-files-found: error
          path: ${{ matrix.directory }}/infracost.json

  # Open-source cost estimate from the plan artifact. Needs no API key,
  # so it runs on every trigger and comments on the PR when there is one.
  openinfraquote:
    strategy:
      fail-fast: false
      matrix:
        directory: [ec2, s3]
    name: OpenInfraQuote
    needs: terraform-plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ matrix.directory }}
          path: ${{ matrix.directory }}

      - name: OpenInfraQuote
        uses: terrateamio/openinfraquote-action@v1
        with:
          plan-path: ${{ matrix.directory }}/tfplan.json
          comment-on-pr: true
          region: ${{ env.AWS_REGION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  terraform-approval:
    name: Production Approval
    needs:
      - terraform-plan
      - infracost
      - openinfraquote
    # Deployments only ever run from main, never from feature branches or PRs.
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.terraform-plan.result == 'success' &&
      (needs.infracost.result == 'success' || needs.infracost.result == 'skipped') &&
      needs.openinfraquote.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
    steps:
      - name: Approval
        run: echo "Production approval granted."

  terraform-apply:
    strategy:
      fail-fast: false
      matrix:
        directory: [ec2, s3]
    name: Terraform Apply - ${{ matrix.directory }}
    needs: terraform-approval
    # always() stops GitHub from skipping this job when an optional
    # upstream job (e.g. Infracost) was skipped.
    if: always() && needs.terraform-approval.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Configure repository variable AWS_ROLE_ARN with the IAM role ARN.
      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsTerraform

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ matrix.directory }}
          path: ${{ matrix.directory }}

      - name: Terraform Init
        working-directory: ${{ matrix.directory }}
        run: terraform init -input=false

      # State is local to the runner, so each run plans a full "create".
      # Remove the previous deployment first, or apply fails on
      # InvalidGroup.Duplicate and a second instance launches alongside the first.
      # Keep this name in sync with aws_security_group.ec2_sg in main.tf.
      - name: Tear down the previous deployment
        if: matrix.directory == 'ec2'
        env:
          SG_NAME: terraform-ec2-sg
        run: |
          sg_id=$(aws ec2 describe-security-groups \
            --region "$AWS_REGION" \
            --filters "Name=group-name,Values=${SG_NAME}" \
            --query 'SecurityGroups[0].GroupId' \
            --output text)

          if [ -z "$sg_id" ] || [ "$sg_id" = "None" ]; then
            echo "No previous deployment found."
            exit 0
          fi

          instance_ids=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters "Name=instance.group-name,Values=${SG_NAME}" \
              "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)

          if [ -n "$instance_ids" ] && [ "$instance_ids" != "None" ]; then
            read -r -a ids <<< "$instance_ids"
            echo "Terminating previous instance(s): ${ids[*]}"
            aws ec2 terminate-instances --region "$AWS_REGION" --instance-ids "${ids[@]}"
            aws ec2 wait instance-terminated --region "$AWS_REGION" --instance-ids "${ids[@]}"
          fi

          # The security group can only be deleted once its interfaces are released.
          attached=""
          for attempt in 1 2 3 4 5 6; do
            attached=$(aws ec2 describe-network-interfaces \
              --region "$AWS_REGION" \
              --filters "Name=group-id,Values=$sg_id" \
              --query 'length(NetworkInterfaces)' \
              --output text)
            [ "$attached" = "0" ] && break
            echo "Waiting ($attempt/6) for $attached interface(s) to go away..."
            sleep 5
          done

          if [ "$attached" != "0" ]; then
            echo "::error::Security group $sg_id still has $attached network interface(s) attached. Nothing was deleted."
            exit 1
          fi

          echo "Deleting security group $sg_id from the previous run."
          aws ec2 delete-security-group --region "$AWS_REGION" --group-id "$sg_id"

      - name: Terraform Apply
        working-directory: ${{ matrix.directory }}
        run: terraform apply -input=false -auto-approve tfplan

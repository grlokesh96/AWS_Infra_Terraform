---
name: Terraform CI/CD (AWS)

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

env:
  TF_VERSION: "1.9.8"
  TF_WORKING_DIR: "./ec2"
  AWS_REGION: "us-east-1"

jobs:

  config-check:
    name: Config Check
    runs-on: ubuntu-latest

    outputs:
      infracost_enabled: ${{ steps.secrets.outputs.infracost_enabled }}

    steps:
      - name: Check optional secrets
        id: secrets
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          if [ -n "${INFRACOST_API_KEY}" ]; then
            echo "infracost_enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "infracost_enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::INFRACOST_API_KEY not set, Infracost skipped"
          fi


  terraform-init-validate:
    name: Terraform Init & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false -input=false

      - name: Terraform Format
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate


  tflint:
    name: TFLint
    needs: terraform-init-validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: tflint --init

      - name: TFLint Scan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: tflint --recursive


  tfsec:
    name: tfsec
    needs: terraform-init-validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: tfsec Scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ env.TF_WORKING_DIR }}


  gitleaks:
    name: Gitleaks
    needs: terraform-init-validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  terrascan:
    name: Terrascan
    needs: terraform-init-validate
    runs-on: ubuntu-latest

    env:
      TERRASCAN_VERSION: "1.19.9"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # tenable/terrascan-action ships an outdated terrascan binary that
      # no longer compiles the current policy bundle, so install a pinned
      # release instead.
      - name: Install Terrascan
        run: |
          repo="tenable/terrascan/releases/download/v${TERRASCAN_VERSION}"
          pkg="terrascan_${TERRASCAN_VERSION}_Linux_x86_64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/ts.tgz" \
            "https://github.com/${repo}/${pkg}"
          tar -xzf "${RUNNER_TEMP}/ts.tgz" \
            -C "${RUNNER_TEMP}" terrascan
          sudo install -m 0755 "${RUNNER_TEMP}/terrascan" \
            /usr/local/bin/terrascan
          terrascan init

      - name: Terrascan Scan
        run: terrascan scan -i terraform -d "${TF_WORKING_DIR}"


  super-linter:
    name: Super Linter
    needs: terraform-init-validate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Super Linter
        uses: super-linter/super-linter/slim@v7
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_TERRAFORM: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true


  terraform-plan:
    name: Terraform Plan

    needs:
      - terraform-init-validate
      - tflint
      - tfsec
      - gitleaks
      - terrascan
      - super-linter

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -out=tfplan

      - name: Generate Plan Report
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          if-no-files-found: error
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/tfplan.txt


  infracost:
    name: Infracost
    needs:
      - terraform-plan
      - config-check

    if: needs.config-check.outputs.infracost_enabled == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false -input=false

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Cost Estimate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          infracost breakdown \
            --path . \
            --format json \
            --out-file infracost.json
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

      - name: Display Cost
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          infracost output \
            --path infracost.json \
            --format table

      - name: Upload Infracost Report
        uses: actions/upload-artifact@v4
        with:
          name: infracost-report
          if-no-files-found: error
          path: ${{ env.TF_WORKING_DIR }}/infracost.json


  terraform-approval:
    name: Production Approval
    needs:
      - terraform-plan
      - infracost

    # Deployments only ever run from main, never from feature branches
    # or pull requests.
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.terraform-plan.result == 'success' &&
      (needs.infracost.result == 'success' ||
        needs.infracost.result == 'skipped')

    runs-on: ubuntu-latest

    permissions:
      contents: read

    environment:
      name: production

    steps:
      - name: Approval
        run: echo "Production approval granted."


  terraform-apply:
    name: Terraform Apply
    needs: terraform-approval

    if: needs.terraform-approval.result == 'success'

    runs-on: ubuntu-latest

    permissions:
      contents: read

    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve tfplan

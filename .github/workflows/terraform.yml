name: Terraform CI/CD (AWS)

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

env:
  TF_VERSION: "1.9.8"
  TF_WORKING_DIR: "./infrastructure"
  AWS_REGION: "us-east-1"

jobs:

  terraform-init-validate:
    name: Terraform Init & Validate
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false

      - name: Terraform Format
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate


  tflint:
    name: TFLint
    needs: terraform-init-validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: tflint --init

      - name: TFLint Scan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: tflint --recursive


  tfsec:
    name: tfsec
    needs: terraform-init-validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: tfsec Scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ env.TF_WORKING_DIR }}


  gitleaks:
    name: Gitleaks
    needs: terraform-init-validate
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  terrascan:
    name: Terrascan
    needs: terraform-init-validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Terrascan Scan
        uses: tenable/terrascan-action@main
        with:
          iac_type: terraform
          iac_dir: ${{ env.TF_WORKING_DIR }}


  super-linter:
    name: Super Linter
    needs: terraform-init-validate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Super Linter
        uses: super-linter/super-linter/slim@v7
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_TERRAFORM: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true


  terratest:
    name: Terratest
    needs: terraform-init-validate
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Dependencies
        working-directory: ${{ env.TF_WORKING_DIR }}/tests
        run: go mod download

      - name: Run Terratest
        working-directory: ${{ env.TF_WORKING_DIR }}/tests
        run: go test -v -timeout 30m


  terraform-plan:
    name: Terraform Plan

    needs:
      - terraform-init-validate
      - tflint
      - tfsec
      - gitleaks
      - terrascan
      - super-linter
      - terratest

    if: |
      always() &&
      needs.terraform-init-validate.result == 'success' &&
      (needs.tflint.result == 'success' || needs.tflint.result == 'skipped') &&
      (needs.tfsec.result == 'success' || needs.tfsec.result == 'skipped') &&
      (needs.gitleaks.result == 'success' || needs.gitleaks.result == 'skipped') &&
      (needs.terrascan.result == 'success' || needs.terrascan.result == 'skipped') &&
      (needs.super-linter.result == 'success' || needs.super-linter.result == 'skipped') &&
      (needs.terratest.result == 'success' || needs.terratest.result == 'skipped')

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -out=tfplan

      - name: Generate Plan Report
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/tfplan.txt


  infracost:
    name: Infracost
    needs: terraform-plan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false

      - name: Setup Infracost
        uses: infracost/actions/setup@v3

      - name: Generate Cost Estimate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          infracost breakdown \
            --path . \
            --format json \
            --out-file infracost.json
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

      - name: Display Cost
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          infracost output \
            --path infracost.json \
            --format table

      - name: Upload Infracost Report
        uses: actions/upload-artifact@v4
        with:
          name: infracost-report
          path: ${{ env.TF_WORKING_DIR }}/infracost.json


  terraform-approval:
    name: Production Approval
    needs:
      - terraform-plan
      - infracost

    if: |
      always() &&
      needs.terraform-plan.result == 'success' &&
      (needs.infracost.result == 'success' || needs.infracost.result == 'skipped')

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Approval
        run: echo "Production approval granted."


  terraform-apply:
    name: Terraform Apply
    needs: terraform-approval

    if: needs.terraform-approval.result == 'success'

    runs-on: ubuntu-latest

    permissions:
      contents: read

    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan
